name: Android build

# 수동 실행(Actions 탭 → Android build → Run workflow).
# 테스트용 APK는 언제나, 스토어 업로드용 AAB는 서명 키 비밀값이 있을 때만 만든다 (docs/RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (업로드할 때마다 1씩 올리기)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Debug APK (친구 테스트용)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ inputs.versionCode }}
      - uses: actions/upload-artifact@v4
        with:
          name: ai-kiugi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release AAB (서명)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease -PversionCode=${{ inputs.versionCode }}
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: ai-kiugi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
